# Verificação automática (CI): roda a cada push no main e em cada pull request.
# Se algum passo falhar, o GitHub mostra um X vermelho no commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Se chegar um push novo, cancela a verificação antiga do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O CI só precisa ler o código.
permissions:
  contents: read

jobs:
  api:
    name: API (lint e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # PostgreSQL e Redis de verdade, ligados ao lado dos testes.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pertim
          POSTGRES_PASSWORD: pertim
          POSTGRES_DB: pertim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pertim -d pertim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pertim:pertim@localhost:5432/pertim
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: segredo-usado-so-nos-testes

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Gerar o cliente do Prisma
        run: npx prisma generate

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Testes de unidade
        run: npm test

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Criar as tabelas (migrations)
        run: npx prisma migrate deploy

      - name: Testes de integração (PostgreSQL e Redis de verdade)
        run: npm run test:int

      - name: Build
        run: npm run build

  web:
    name: Vitrine (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (sobe tudo e confere)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      # Monta as imagens e espera tudo ficar saudável (healthcheck do compose).
      - name: Ligar vitrine, API, PostgreSQL e Redis
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Conferir o /health e as lojas de demonstração
        run: |
          curl -fsS http://localhost:3333/health
          echo
          stores=$(curl -fsS http://localhost:3333/stores | jq length)
          echo "Lojas criadas: $stores"
          test "$stores" -eq 3

      - name: Conferir a busca (extensões unaccent e pg_trgm no banco)
        run: |
          curl -fsS "http://localhost:3333/stores/bicho-bao/search?q=racao%20gato" | grep -q "Gatos Castrados"
          curl -fsS "http://localhost:3333/stores/bicho-bao/search?q=rasao" | grep -q '"match":"similar"'
          echo "A busca sem acento e com erro de digitação funcionou."

      - name: Conferir a vitrine
        run: |
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS http://localhost:3000/moda-chic | grep -q "Vestido Midi de Linho"
          echo "A vitrine da Moda Chic abriu com os produtos."

      - name: Conferir o painel do lojista
        run: |
          curl -fsS http://localhost:3000/painel/entrar | grep -q "Área do lojista"
          curl -fsS http://localhost:3000/sobre | grep -q "Como funciona"
          # Sem login, o painel manda para a tela de entrada.
          destino=$(curl -s -o /dev/null -w "%{redirect_url}" http://localhost:3000/painel)
          echo "Sem login, /painel foi para: $destino"
          echo "$destino" | grep -q "/painel/entrar"

      - name: Mostrar os logs (só se algo deu errado)
        if: failure()
        run: docker compose logs api web

      - name: Desligar
        if: always()
        run: docker compose down -v
